name: Verify and publish payment-core

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle and validate Wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Verify against PostgreSQL Testcontainers
        run: sh gradlew --no-daemon --max-workers=2 check build
      - name: Build image from verified JAR
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/payment-core"
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$image:${GITHUB_SHA}" .
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Publish release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_REF_NAME"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
          if-no-files-found: ignore
