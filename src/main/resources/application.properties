spring.application.name=payment-core
spring.config.import=optional:file:./.env[.properties],optional:configtree:/run/secrets/

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:payment_core}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:payment_core}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:}}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info

logging.pattern.level=%5p [traceId=%X{traceId:-}]

# Fail closed unless a deployment-specific random Base64 key is supplied.
payment.auth.jwt-secret=${JWT_SECRET:}
payment.auth.issuer=payment-core
payment.auth.audience=payment-core-api
payment.auth.access-seconds=900
payment.auth.refresh-seconds=2592000
payment.max-operation-amount-minor=100000000
